name: ChatGPT snapshot transfer
on:
  push:
    paths:
      - 'snapshots/**'
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-snapshot
          path: snapshots/local-snapshot.zip
          if-no-files-found: error
          retention-days: 7
